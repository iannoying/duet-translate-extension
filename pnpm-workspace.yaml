minimumReleaseAge: 0

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - react-redux@9.2.0
  - reselect@5.1.1
  - semver@6.3.1
  - why-is-node-running@3.2.2

allowBuilds:
  core-js: true
  esbuild: true
  msw: true
  nx: true
  spawn-sync: true

# Patches are pinned to exact versions. Redo or drop them when upgrading;
# see "Dependency Patches" in AGENTS.md.
patchedDependencies:
  "@webext-core/messaging@4.0.0": patches/@webext-core__messaging@4.0.0.patch
